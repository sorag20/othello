services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_TARGET: http://backend:5000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "8080:8080"
    depends_on:
      - backend
